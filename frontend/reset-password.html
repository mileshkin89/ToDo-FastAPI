<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - Smart ToDo</title>
    <link rel="stylesheet" href="/static/css/reset-password.css">
</head>
<body>
    <div class="container">
        <div class="reset-password-card">
            <div class="card-header">
                <h1>Reset password</h1>
                <p class="subtitle">Enter a new password for your account</p>
            </div>
            
            <form id="resetPasswordForm" class="reset-password-form">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
                
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        name="new_password" 
                        required 
                        minlength="5" 
                        maxlength="100"
                        placeholder="Enter a new password (minimum 5 characters)"
                    >
                    <span class="field-error" id="newPasswordError"></span>
                </div>
                
                <div class="form-group">
                    <label for="repeatPassword">Repeat password</label>
                    <input 
                        type="password" 
                        id="repeatPassword" 
                        name="repeat_new_password" 
                        required 
                        minlength="5" 
                        maxlength="100"
                        placeholder="Repeat new password"
                    >
                    <span class="field-error" id="repeatPasswordError"></span>
                </div>
                
                <input type="hidden" id="resetToken" name="token">
                
                <button type="submit" class="submit-button" id="submitButton">
                    <span class="button-text">Reset password</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>
            
            <div class="card-footer">
                <a href="/" class="back-link">← Return to home</a>
            </div>
        </div>
    </div>
    
    <script src="/static/js/reset-password.js"></script>
</body>
</html>
